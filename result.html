<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Submissions Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(-45deg, #e0f2fe, #f5e8ff, #d9f7fa, #e6f9ed);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto p-6 max-w-5xl">
        <h1 class="center-align text-5xl font-extrabold text-gray-900 mb-10 tracking-tight bg-gradient-to-r from-purple-500 to-indigo-500 bg-clip-text text-transparent">Message Submissions</h1>
        <div class="row mb-6">
            <div class="col s12">
                <input type="text" id="searchInput" placeholder="Search submissions..." class="bg-white bg-opacity-80 shadow-lg rounded-full px-6 py-4 text-gray-700 focus:ring-4 focus:ring-indigo-200 focus:outline-none transition-all duration-300 hover:shadow-xl">
            </div>
        </div>
        <div class="row mb-8">
            <div class="col s12 flex space-x-4 justify-center">
                <a href="#!" class="btn-small bg-purple-500 text-white tag-btn px-8 py-3 rounded-full shadow-md hover:bg-purple-600 focus:ring-2 focus:ring-purple-300 transition-all duration-300 flex items-center justify-center text-base font-medium" data-tag="high">High Budget</a>
                <a href="#!" class="btn-small bg-indigo-500 text-white tag-btn px-8 py-3 rounded-full shadow-md hover:bg-indigo-600 focus:ring-2 focus:ring-indigo-300 transition-all duration-300 flex items-center justify-center text-base font-medium" data-tag="low">Low Budget</a>
                <a href="#!" class="btn-small bg-gray-400 text-white tag-btn px-8 py-3 rounded-full shadow-md hover:bg-gray-500 focus:ring-2 focus:ring-gray-300 transition-all duration-300 flex items-center justify-center text-base font-medium" data-tag="">All</a>
            </div>
        </div>
        <ul id="contactList" class="collapsible"></ul>
    </div>

    <div id="mailModal" class="modal rounded-2xl max-w-lg mx-auto">
        <div class="modal-content relative bg-white bg-opacity-90">
            <div class="absolute top-0 left-0 w-full h-16 bg-gradient-to-r from-purple-500 to-indigo-500 rounded-t-2xl"></div>
            <h4 class="text-gray-900 font-extrabold text-2xl mt-8 mb-4 relative z-10">Send Email</h4>
            <p class="text-gray-600 mb-4 relative z-10">Sending to: <span id="recipientEmail" class="font-semibold text-indigo-600"></span></p>
            <form id="mailForm">
                <input type="hidden" id="mailTo" name="email">
                <input type="hidden" id="mailName" name="name">
                <div class="input-field mb-4">
                    <input type="text" id="mailSubject" name="subject" required class="bg-white bg-opacity-80 border-gray-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-300 focus:outline-none">
                    <label for="mailSubject" class="text-gray-700">Subject</label>
                </div>
                <div class="input-field mb-4">
                    <textarea id="mailBody" name="message" class="materialize-textarea bg-white bg-opacity-80 border-gray-200 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-300 focus:outline-none" required></textarea>
                    <label for="mailBody" class="text-gray-700">Message</label>
                </div>
                <div class="modal-footer flex justify-end space-x-3">
                    <a href="#!" class="modal-close btn-flat text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg px-4 py-2 transition-all">Cancel</a>
                    <button type="submit" class="btn bg-indigo-500 text-white hover:bg-indigo-600 rounded-lg px-6 py-2 shadow-md transition-all">Send</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            M.AutoInit();
            const gradients = [
                'bg-gradient-to-r from-purple-100 to-indigo-200', 
                'bg-gradient-to-r from-indigo-100 to-blue-200', 
                'bg-gradient-to-r from-blue-100 to-purple-200', 
                'bg-gradient-to-r from-violet-100 to-fuchsia-200', 
                'bg-gradient-to-r from-fuchsia-100 to-purple-200'
            ];
            let allContacts = [];

            // Define custom format delimiters like the first example
            const parseCustomFormat = text => text.split('፨፨፨፨፨፨').map(line => line.trim() ? line.split('፨፨፨').map(field => field.replace(/፨፨/g, '፨፨፨')) : []).filter(contact => contact.length > 0);

            const renderContacts = contacts => {
                const contactList = document.getElementById('contactList');
                contactList.innerHTML = '';
                contacts.forEach((contact, index) => {
                    // Mapping fields for the new form structure
                    const [name, email, topic, budget, message] = contact;
                    const contactItem = document.createElement('li');
                    contactItem.className = `collapsible-item shadow-md hover:shadow-lg transition-shadow rounded-xl mb-3`;
                    contactItem.innerHTML = `
                        <div class="collapsible-header ${gradients[index % gradients.length]} bg-opacity-80 rounded-t-xl">
                            <div class="row" style="margin-bottom: 0; width: 100%;">
                                <div class="col s10">
                                    <span class="text-gray-600 text-lg font-medium">${contacts.length - index}.</span>
                                    <span class="text-gray-900 font-bold text-lg ml-2">${name}</span>
                                    <span class="text-gray-500 right hide-on-med-and-down text-sm"> | ${topic} | ${email}</span>
                                    <span class="text-gray-500 right hide-on-large-only text-sm"> | ${topic}</span>
                                </div>
                                <div class="col s2 right-align">
                                    <a href="#!" class="delete-btn"><i class="material-icons text-red-500 text-2xl hover:text-red-600 transition-colors">delete</i></a>
                                </div>
                            </div>
                        </div>
                        <div class="collapsible-body bg-transparent rounded-b-xl">
                            <p class="text-gray-600 hide-on-large-only text-sm mb-2"><strong>Email:</strong> ${email}</p>
                            <p class="text-gray-700 mb-2"><strong>Topic:</strong> ${topic}</p>
                            <p class="text-gray-700 mb-2"><strong>Budget:</strong> ${budget}</p>
                            <p class="text-gray-700 mb-4"><strong>Message:</strong> ${message}</p>
                            <div class="right-align">
                                <a href="#!" class="mail-btn"><i class="material-icons text-indigo-500 text-2xl hover:text-indigo-600 transition-colors">email</i></a>
                            </div>
                        </div>
                    `;
                    contactItem.querySelector('.delete-btn').addEventListener('click', e => { 
                        e.stopPropagation(); 
                        if (confirm('Are you sure you want to delete this entry?')) deleteContact(contact, contactItem); 
                    });
                    contactItem.querySelector('.mail-btn').addEventListener('click', e => { 
                        e.stopPropagation(); 
                        const modal = M.Modal.getInstance(document.getElementById('mailModal')); 
                        document.getElementById('mailTo').value = email; 
                        document.getElementById('mailName').value = name; 
                        document.getElementById('recipientEmail').textContent = email; 
                        modal.open(); 
                    });
                    contactList.appendChild(contactItem);
                });
                M.Collapsible.init(document.querySelectorAll('.collapsible'));
            };

            const deleteContact = (contact, contactItem) => fetch('assets/php/delete_contact.php', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify(contact) 
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    contactItem.remove();
                    allContacts = allContacts.filter(c => c.join('') !== contact.join(''));
                    applyFilters();
                    M.toast({html: 'Contact deleted successfully', classes: 'rounded indigo'});
                } else alert('Failed to delete entry: ' + data.error);
            })
            .catch(error => { 
                console.error('Error:', error); 
                alert('An error occurred while deleting the entry'); 
            });

            const applyFilters = () => {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const activeTag = document.querySelector('.tag-btn.active')?.dataset.tag || '';
                
                let filteredContacts = allContacts.filter(contact => 
                    contact.some(field => field.toLowerCase().includes(searchTerm))
                );
                
                if (activeTag === 'high') {
                    filteredContacts = filteredContacts.filter(contact => {
                        const budget = contact[3].toLowerCase();
                        // Filter for high budgets (containing numbers over 10000 or words like high, large)
                        return /([1-9]\d{4,}|high|large)/i.test(budget);
                    });
                } else if (activeTag === 'low') {
                    filteredContacts = filteredContacts.filter(contact => {
                        const budget = contact[3].toLowerCase();
                        // Filter for low budgets (containing numbers under 10000 or words like low, small)
                        return /(^[1-9]\d{0,3}$|low|small)/i.test(budget);
                    });
                }
                
                renderContacts(filteredContacts);
            };

            // Load data from the server
            fetch('assets/php/form_submissions.txt')
                .then(response => response.text())
                .then(data => {
                    allContacts = parseCustomFormat(data).reverse();
                    renderContacts(allContacts);
                    document.getElementById('searchInput').addEventListener('input', applyFilters);
                    document.querySelectorAll('.tag-btn').forEach(button => button.addEventListener('click', e => {
                        e.preventDefault();
                        document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
                        button.classList.add('active');
                        applyFilters();
                    }));
                })
                .catch(error => { 
                    console.error('Error loading data:', error); 
                    alert('Error loading form submissions. Please try refreshing the page.'); 
                });

            // Event listener for the email form submission
            document.getElementById('mailForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(this);
                formData.append('action', 'send_email');

                fetch('php/mail.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        M.toast({html: data.message, classes: 'rounded indigo'});
                        M.Modal.getInstance(document.getElementById('mailModal')).close();
                        this.reset();
                        M.updateTextFields();
                    } else {
                        M.toast({html: data.message, classes: 'rounded red'});
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    M.toast({html: 'An error occurred while sending the email', classes: 'rounded red'});
                });
            });
        });
    </script>
</body>
</html>
